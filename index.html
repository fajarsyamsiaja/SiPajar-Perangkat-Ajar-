<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c3f">
<title>SiPajar (Perangkat Ajar)</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#17251f;--mut:#5d6f66;--bd:#dbe4df;--g:#0f5c3f;--g2:#1c7a55;--gold:#c9a227;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1713;--card:#16241d;--tx:#e6f0ea;--mut:#9bb0a5;--bd:#27382f;--g2:#4cc08c;--bad:#f2928b}}
:root[data-theme="dark"]{--bg:#0e1713;--card:#16241d;--tx:#e6f0ea;--mut:#9bb0a5;--bd:#27382f;--g2:#4cc08c;--bad:#f2928b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:19px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,var(--g),#1d5f8f);color:#fff;border:0}
.hero img{width:60px;height:60px;border-radius:12px;background:#fff;object-fit:contain;padding:3px}.hero b{font-size:17px;display:block}.hero small{opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{font-size:26px;color:var(--g2);display:block}.stats span{color:var(--mut);font-size:13px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:11px 12px;width:100%}
textarea{resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
button{cursor:pointer;width:auto}.pri{background:var(--g);color:#fff;border:0;font-weight:600;width:100%;margin-top:14px}
.big button{width:100%;background:var(--card);padding:12px 4px;font-weight:600;font-size:14px;text-align:center}.big button span{display:flex;width:46px;height:46px;margin:0 auto 6px;border-radius:14px;align-items:center;justify-content:center;font-size:24px;background:var(--c,#e4f2ea)}.big button small{display:block;font-weight:400;font-size:10px;line-height:1.2;color:var(--mut);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.seg button{flex:1 1 22%;padding:10px 4px;font-size:14px}.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item b{display:block;font-size:15px}.item small{color:var(--mut)}.item div:last-child{display:flex;gap:6px;flex-shrink:0}
.item button{padding:6px 10px;font-size:14px}.del{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}.note{font-size:12px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;border-radius:0;padding:8px 0;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center}
.tabs button b{font-size:20px;font-weight:400}.tabs button.on{color:var(--g2);font-weight:600}
.doc{background:#fff;color:#000;border:1px solid var(--bd);border-radius:8px;padding:14px;font:13px/1.5 "Times New Roman",serif;overflow-x:auto}
.doc table{border-collapse:collapse;width:100%}.doc td,.doc th{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
.doc h3{text-align:center;margin:8px 0}.doc h4{margin:10px 0 3px;background:#e4f2ea;padding:3px 6px}.doc ul{margin:2px 0;padding-left:20px}
.kop{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:8px}.kop .kt{text-align:center;min-width:0}.kop .kt b{display:block;font-size:18px;line-height:1.2;letter-spacing:.3px}.kop .kt small{display:block;font-size:10px;line-height:1.35;margin-top:3px;text-wrap:balance}.kop img{width:64px;height:64px;object-fit:contain;display:block}
.doc table.sg{margin-top:16px}.doc table.sg td{border:0;text-align:center;width:50%}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9;font-size:14px}
@media print{.tabs,.noprint,#toast{display:none!important}.wrap{padding:0;max-width:none}body{background:#fff}.doc{border:0;padding:0}.card{border:0;padding:0}}
.doc{font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.doc th{background:#e4f2ea}.doc h3{font-size:15px;letter-spacing:.5px}.doc h4{border-left:4px solid #0f5c3f;background:#eef6f1}.doc tr{break-inside:avoid}.doc p{margin:4px 0}.pb{border-top:2px dashed #9bb;margin:18px 0 10px}.doc small{font-size:11px}
@media print{@page{size:A4;margin:14mm}.pb{border:0;margin:0;page-break-before:always}.doc{font-size:11.5pt}.doc h4{page-break-after:avoid}}
</style>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiPajar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" id="ico">
<link rel="apple-touch-icon" id="aico">
<link rel="manifest" id="mf">
<style>#inst{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;display:none;background:var(--g);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25)}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

 function tbl(t){
